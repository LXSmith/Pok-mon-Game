<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030406">
  <title>Pokémon Real-Life RPG - MOVE</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&display=swap">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CINEMATIC INTRO SCREEN -->
  <div id="intro-screen">
    <div class="intro-container" id="introContainer">
      <div class="card-stream" id="cardStream"></div>
      <div class="bg-glow"></div>
      <div class="slash-effect"></div>
      <div class="flash-overlay"></div>

      <div class="title-wrapper">
        <div class="title-pokemon">Pokémon</div>
        <div class="title-move">MOVE</div>
      </div>

      <div class="start-prompt">BERÜHREN ZUM STARTEN</div>
    </div>
  </div>

  <!-- GAME SCREEN CONTAINER -->
  <div id="game-screen" class="container hidden">
    <!-- Rest deiner HTML-Screens (Main Menu, Slots, Radar, etc.) -->
  </div>

  <script src="app.js"></script>
</body>
</html>
